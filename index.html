<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language="javascript" type="text/javascript">
        var arr = new Array(32,21,24,53,21);
        var i, j, temp;

        for(i=0 ; i<5;  i++){
            document.write(arr[i] + "<br/>");
        }

        for(i=0 ; i<6; i++){
            for(j=0 ; j<6 ; j++){
                if(arr[j] > arr[j+1]){
                    temp = arr[j];
                    arr[j] = arr[j+1];
                    arr[j+1] = temp;
                }
            }
        }
        document.write("<br/> <br/>after sort.. <br/>");
        for(i=0 ; i<6; i++){
            document.write(arr[i] + "<br/>");
        }
    </script>
</body>
</html>
