<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- product of  a number -->
    <script language="javascript" type="text/javascript">
        var i;
        var prod = 1;
        var num = parseInt(prompt("Enter a number","Enter.."))
        for(i=1; i<num ; i++){
            prod = prod * i;
            }
        
        document.write("prod =" +prod);
    </script>
</body>
</html>
